<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion – TransAfrica</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html">TransAfrica</a>
    <nav id="nav" class="nav" aria-label="Compte"></nav>
  </header>

  <main class="wrap">
    <h1 class="page-title">Connexion</h1>

    <form id="login-form" class="card" novalidate>
      <div class="field">
        <label for="email">Adresse e-mail</label>
        <input id="email" type="email" autocomplete="email" maxlength="254" required>
      </div>
      <div class="field">
        <label for="password">Mot de passe</label>
        <input id="password" type="password" autocomplete="current-password" maxlength="72" required>
      </div>
      <button class="btn" id="submit-btn" type="submit">Se connecter</button>
    </form>

    <p id="status" class="status" role="status" aria-live="polite" hidden></p>
    <p class="alt">Pas encore de compte ? <a href="signup.html">Créer un compte</a></p>
  </main>

  <script type="module" src="js/session.js"></script>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
